name: Docker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment name (integration, validation)"
        required: true
        default: "integration"
  push:
    branches:
      - develop
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'integration' }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sirena-tools:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy

      - name: Scan image with Trivy
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity CRITICAL,HIGH \
            sirena-tools:scan

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${ENVIRONMENT}
    needs: "build-and-push"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4.3.0
      with:
        version: v3.19.0
      id: install

    - name: render manifests using helm chart
      shell: bash
      run: |
        pwd
        ls -la
        cd helm_charts
        helm repo add SDPSN-devops-charts https://pic.sg.social.gouv.fr/api/v4/projects/94/packages/helm/stable --username oauth2 --password ${{ secrets.HELM_REPO_PAT }}
        helm dependency update
        helm dependency build
        echo "${ENVIRONMENT} ${GITHUB_SHA::8}"
        ./generate_manifests.sh ${ENVIRONMENT} ${GITHUB_SHA::8}

    - name: Checkout GitOps repository
      uses: actions/checkout@v5
      with:
        repository: fabrique-atlas/org-sdpsn-ws-sirena
        path: gitops-repo
        ssh-key: ${{ secrets.GITOPS_REPO_KEY }}

    - name: Deploy to GitOps
      shell: bash
      run: |
        ls -la
        ls -la gitops-repo/deployment-targets/${ENVIRONMENT}/
        rm -r gitops-repo/deployment-targets/${ENVIRONMENT}/tools/*
        mv helm_charts/generated_manifests/sirena-tools-app/* gitops-repo/deployment-targets/${ENVIRONMENT}/tools/

        git config --global user.name "github-actions[bot]"
        # mail standard bot github Actions
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        cd gitops-repo
        git add .

        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit, skipping commit and push"
        else
          git commit -m '[${ENVIRONMENT} ] new version ${GITHUB_SHA::8}'
          git push
        fi
