---
SDPSN-devops-charts:
  name: sirena-tools

  deployment:
    enable: false
  ingress:
    enable: false
  service:
    enable: false

  externalSecret:
    registry:
      keystoreName: ghcr-registry
      enable: true
    app:
      enable: true
      targetSecretName: sirena-tools
      keystoreName: sirena-tools
      template:
        # Auth tokens for incoming webhooks (comma-separated for rolling rotation)
        WEBHOOK_TOKEN: "{{ .WEBHOOK_TOKEN }}"
        # Mattermost incoming webhook URLs — add one entry per configured channel
        WEBHOOK_MATTERMOST_ALERTS_URL: "{{ .WEBHOOK_MATTERMOST_ALERTS_URL }}"
